services:
  azurite:
    # Emulador local de Azure Storage -- reemplaza la Storage Account real
    # (nexuscorp, Azure) mientras no se despliega. `AZURE_STORAGE_CONNECTION_STRING`
    # en .env.dev usa las credenciales de desarrollo PUBLICAS y bien
    # conocidas de Azurite (no son un secreto, son las mismas para
    # cualquiera que corra Azurite) -- en produccion se pisa con la
    # connection string real de nexuscorp, sin ningun cambio de código.
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    # --skipApiVersionCheck: @azure/storage-blob manda una version de API
    # mas nueva que la que Azurite 3.35.0 reconoce por defecto (rechaza con
    # InvalidHeaderValue/400 sin esto). Solo afecta al emulador local -- la
    # Storage Account real de Azure acepta cualquier version del SDK, esto
    # nunca corre en produccion.
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

  db:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_APP: ${DATABASE_URL_APP}
      CRM_APP_DB_PASSWORD: ${CRM_APP_DB_PASSWORD}
      PORT: ${PORT}
      NODE_ENV: ${NODE_ENV}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS}
      SEED_PASSWORD: ${SEED_PASSWORD}
      SEED_BRIDGE_CLAVE_API: ${SEED_BRIDGE_CLAVE_API}
      CORS_ORIGIN: ${CORS_ORIGIN}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET}
      META_APP_ID: ${META_APP_ID}
      META_ADS_OAUTH_REDIRECT_URI: ${META_ADS_OAUTH_REDIRECT_URI:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      LINKEDIN_API_VERSION: ${LINKEDIN_API_VERSION}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI}
      LINKEDIN_API_BASE_URL: ${LINKEDIN_API_BASE_URL}
      WHATSAPP_OAUTH_REDIRECT_URI: ${WHATSAPP_OAUTH_REDIRECT_URI:-}
      REPORTES_STORAGE_DIR: ${REPORTES_STORAGE_DIR:-storage/reportes}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER_ISOTIPOS: ${AZURE_STORAGE_CONTAINER_ISOTIPOS:-isotipos}
      AZURE_STORAGE_PUBLIC_BASE_URL: ${AZURE_STORAGE_PUBLIC_BASE_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - backend_node_modules:/app/node_modules
      - backend_pkg_node_modules:/app/backend/node_modules
    # D8 (Bloque C, Etapa 3): entre `migrate deploy` (rol superusuario,
    # DATABASE_URL) y el arranque del servidor, fija la contraseña del rol
    # de runtime no-superusuario `crm_app` de forma idempotente. La
    # contraseña nunca vive en la migración versionada (git) — solo en
    # `.env` (gitignored) vía CRM_APP_DB_PASSWORD.
    command: >
      sh -c "pnpm --filter backend exec prisma migrate deploy &&
      echo \"ALTER ROLE crm_app WITH LOGIN PASSWORD '$$CRM_APP_DB_PASSWORD';\" |
      pnpm --filter backend exec prisma db execute --url \"$$DATABASE_URL\" --stdin &&
      pnpm --filter backend dev"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/v1/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
      - frontend_pkg_node_modules:/app/frontend/node_modules

volumes:
  azurite_data:
  pgdata:
  backend_node_modules:
  backend_pkg_node_modules:
  frontend_node_modules:
  frontend_pkg_node_modules:
